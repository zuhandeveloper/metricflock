# DEV-ONLY — never use this file on a shared or production host.
# The database password is NOT stored here: it must come from the
# POSTGRES_PASSWORD environment variable (a shell export, or a `.env`
# file in this directory — note Compose does NOT read apps/web/.env,
# the canonical app env file). Start the stack with:
#   POSTGRES_PASSWORD=<dev-only password> docker compose up -d
# The password must match the one in your DATABASE_URL (apps/web/.env;
# the template uses postgresql://analytics:<password>@localhost:5432/analytics_cms).
# Ports are bound to localhost only (127.0.0.1). Redis runs without auth
# by design — localhost binding is the protection for this dev-only file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for local dev}
      POSTGRES_DB: analytics_cms
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
volumes: { pgdata: {}, redisdata: {} }
