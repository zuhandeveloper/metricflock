packages:
  - "apps/*"
  - "packages/*"

# Shared dependency versions live here exactly once (pnpm catalog). Every
# workspace that uses one of these packages references it as "catalog:",
# so versions can never drift apart across the monorepo.
catalog:
  "@types/node": ^26.6.6
  better-auth: ^1.7.27
  bullmq: ^6.7.8
  cross-env: ^10.1.0
  next: ^16.4.6
  tsx: ^4.23.15
  typescript: ^7.0.2
  zod: ^4.6.7

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true

# Security overrides (pnpm audit gate, CI-4): force patched versions of
# transitive deps. effect <=3.22.0 has a ReDoS in Schema.TemplateLiteral
# (GHSA-7589-6fvf-x4pw), pulled in via prisma>@prisma/config (pins 3.20.0).
# Stay within effect 3.x, which is what @prisma/config expects.
overrides:
  "effect@<3.22.1": "^3.22.1"

# Supply-chain age gate (CI-7): refuse to resolve package versions
# published <24h ago — most malicious/compromised releases are caught
# within that window. Lockfile-pinned installs (CI --frozen-lockfile)
# are unaffected; only new resolutions are gated. The previous value
# (0, with a wrangler/miniflare rationale) was stale — Cloudflare
# tooling was removed 2026-11-20.
minimumReleaseAge: 1440
