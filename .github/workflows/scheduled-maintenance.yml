name: Scheduled maintenance

# Weekly dependency audit for the pnpm workspace (pnpm audit against
# the npm advisory DB). Also runnable on demand via workflow_dispatch.
# The same audit runs as a gate in ci.yml on every push/PR; this
# weekly run catches newly disclosed advisories in unchanged code.

on:
  schedule:
    # Weekly, Monday 07:00 UTC — after the 06:00 security audit.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Least privilege: these jobs only read the repository. No secrets
# are used anywhere in this workflow.
permissions:
  contents: read

# Serialize maintenance runs (never cancel): two overlapping audit
# runs would double the install work for no benefit. A manual
# dispatch while a run is in flight queues behind it instead of
# killing it.
concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  node-audit:
    # pnpm audit of pnpm-lock.yaml. Fails the run when a
    # known-vulnerable dependency is present.
    name: Audit Node dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input: package.json pins pnpm via
      # `packageManager` and pnpm/action-setup reads it.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit
